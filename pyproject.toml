[project]
name = "volumen-events"
version = "0.1.0"
description = "List events from columes"
readme = "README.md"
authors = [
    { name = "wlanboy", email = "wlanboy@github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
volumen-events = "volumen_events:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
